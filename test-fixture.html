"""

def monitor_mouse(device_path: str = "/dev/input/by-id/usb-Logitech_G_Pro-event-mouse"):
    device = InputDevice(device_path)

    last_press = None

    function streamTextInto(el, text, speedMs = 12) {
      return new Promise((resolve) => {
        el.textContent = '';
        let i = 0;
        const interval = setInterval(() => {
          i += 3;
          if (i >= text.length) {
            el.textContent = text;
            clearInterval(interval);
            resolve();
          } else {
            el.textContent = text.slice(0, i);
          }
        }, speedMs);
      });
    }

        const interval = setInterval(() => {
          i += chunkSize;
          if (i >= codeText.length) {
            codeEl.textContent = codeText;
            clearInterval(interval);
            resolve();
          } else {
            codeEl.textContent = codeText.slice(0, i);
          }

            </button>
            <button class="code-btn" title="Copy code">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
          </div>
        </div>
        <pre><code></code></pre>
      `;
      respContainer.appendChild(codeBlockEl);

      // Trigger extension to discover the new code block
      if (window.__GeminiOrgMod && typeof window.__GeminiOrgMod.scan === 'function') {
        window.__GeminiOrgMod.scan();
      }

      // 5. Stream code content
      const codeEl = codeBlockEl.querySelector('code');
      await streamCodeInto(codeEl, data.content, 26, 28);
      await delay(150);

      // 6. Append response outro text
      if (data.responseOutro) {
        const outroEl = document.createElement('p');
        outroEl.className = 'response-outro';
        respContainer.appendChild(outroEl);
        await streamTextInto(outroEl, data.responseOutro, 10);
      }

      // 7. Restore buttons
      const streamBtn = exDiv.querySelector('button[data-action="stream"]');
      if (streamBtn) {
        streamBtn.textContent = '▶ Stream';
        streamBtn.disabled = false;
      }
    }

    // Initialize with Exchange 1
    renderExchangeStatic(EXCHANGES[0]);

    // Top Bar Event Handlers
    const streamAllBtn = document.getElementById('btn-stream-all');
    streamAllBtn?.addEventListener('click', async () => {
      // Find all currently active exchange numbers (or all 4 if starting fresh)
      let activeNums = Array.from(document.querySelectorAll('.message-exchange'))
        .map((el) => parseInt(el.getAttribute('data-exchange') || '1', 10));
      if (activeNums.length === 0) activeNums = [1, 2, 3, 4];

      // Disable all controls during global stream
      document.querySelectorAll('.demo-btn, .exchange-action-btn').forEach((b) => (b.disabled = true));

      // Clear container to start from clean empty state
      container.innerHTML = '';
      if (window.__GeminiOrgMod && typeof window.__GeminiOrgMod.scan === 'function') {
        window.__GeminiOrgMod.scan();
      }

      // Stream each active exchange in sequence
      for (let i = 0; i < activeNums.length; i++) {
        const num = activeNums[i];
        const data = EXCHANGES.find((e) => e.num === num) || EXCHANGES[0];
        streamAllBtn.textContent = `Streaming Exchange ${i + 1}/${activeNums.length}...`;
        await streamExchangeLive(data);
        await delay(350);
      }

      // Re-enable controls
      document.querySelectorAll('.demo-btn, .exchange-action-btn').forEach((b) => (b.disabled = false));
      streamAllBtn.textContent = '▶ Stream All Exchanges';
    });

    document.getElementById('btn-add-ex2')?.addEventListener('click', () => {
      const data = EXCHANGES.find((e) => e.num === 2);
      if (data) streamExchangeLive(data);
    });

    document.getElementById('btn-add-ex3')?.addEventListener('click', () => {
      const data = EXCHANGES.find((e) => e.num === 3);
      if (data) streamExchangeLive(data);
    });

    document.getElementById('btn-add-ex4')?.addEventListener('click', () => {
      const data = EXCHANGES.find((e) => e.num === 4);
      if (data) streamExchangeLive(data);
    });

    document.getElementById('btn-add-ex5')?.addEventListener('click', () => {
      const data = EXCHANGES.find((e) => e.num === 5);
      if (data) streamExchangeLive(data);
    });

    document.getElementById('btn-reset-all')?.addEventListener('click', () => {
      container.innerHTML = '';
      renderExchangeStatic(EXCHANGES[0]);
    });

    // Delegated exchange action buttons
    container.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn || btn.disabled) return;

      const action = btn.getAttribute('data-action');
      const num = parseInt(btn.getAttribute('data-exchange-num') || '1', 10);
      const data = EXCHANGES.find((item) => item.num === num);
      if (!data) return;

      if (action === 'stream') {
        btn.disabled = true;
        await streamExchangeLive(data);
      } else if (action === 'reset') {
        renderExchangeStatic(data);
      } else if (action === 'remove') {
        const exEl = document.getElementById(`exchange-${num}`);
        if (exEl) {
          exEl.remove();
          if (window.__GeminiOrgMod && typeof window.__GeminiOrgMod.scan === 'function') {
            window.__GeminiOrgMod.scan();
          }
        }
      }
    });
  </script>
</body>
</html>
